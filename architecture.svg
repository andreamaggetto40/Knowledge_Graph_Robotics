<svg width="680" height="486" viewBox="0 0 680 486" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>SpatialKG system architecture</title>
<desc>Batch scan files and live PODGE detections feed a SpatialKG core (reasoning, embeddings, evolution), which exposes a query service consumed by an LLM interface, the GraspKG extension, and the real robot integration, the last of which is only partially complete.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .box-gray { fill: #F1EFE8; stroke: #5F5E5A; }
  .box-gray .th { fill: #444441; }
  .box-gray .ts { fill: #5F5E5A; }
  .box-teal { fill: #E1F5EE; stroke: #0F6E56; }
  .box-teal .th { fill: #085041; }
  .box-teal .ts { fill: #0F6E56; }
  .box-purple { fill: #EEEDFE; stroke: #534AB7; }
  .box-purple .th { fill: #3C3489; }
  .box-purple .ts { fill: #534AB7; }
  .box-amber { fill: #FAEEDA; stroke: #854F0B; stroke-width: 1; }
  .box-amber .th { fill: #633806; }
  .box-amber .ts { fill: #854F0B; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  @media (prefers-color-scheme: dark) {
    svg { background: #1e1e1e; }
    .box-gray { fill: #2C2C2A; stroke: #B4B2A9; }
    .box-gray .th { fill: #F1EFE8; } .box-gray .ts { fill: #D3D1C7; }
    .box-teal { fill: #04342C; stroke: #5DCAA5; }
    .box-teal .th { fill: #E1F5EE; } .box-teal .ts { fill: #9FE1CB; }
    .box-purple { fill: #26215C; stroke: #AFA9EC; }
    .box-purple .th { fill: #EEEDFE; } .box-purple .ts { fill: #CECBF6; }
    .box-amber { fill: #412402; stroke: #EF9F27; }
    .box-amber .th { fill: #FAEEDA; } .box-amber .ts { fill: #FAC775; }
    .arr { stroke: #888780; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="box-gray" x="140" y="40" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="230" y="62" text-anchor="middle" dominant-baseline="central">Batch scans</text>
<rect class="box-gray" x="360" y="40" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="450" y="62" text-anchor="middle" dominant-baseline="central">Live detections</text>

<line x1="230" y1="84" x2="230" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="450" y1="84" x2="450" y2="120" class="arr" marker-end="url(#arrow)"/>

<rect class="box-teal" x="60" y="120" width="560" height="150" rx="16" stroke-width="0.5"/>
<text class="th" x="340" y="148" text-anchor="middle" dominant-baseline="central">SpatialKG core</text>
<text class="ts" x="340" y="165" text-anchor="middle" dominant-baseline="central">Knowledge graph pipeline</text>

<rect class="box-purple" x="80" y="185" width="166" height="56" rx="10" stroke-width="0.5"/><text class="th" x="163" y="199" text-anchor="middle" dominant-baseline="central">Reasoning</text><text class="ts" x="163" y="227" text-anchor="middle" dominant-baseline="central">RDFS + recursion</text>
<rect class="box-purple" x="257" y="185" width="166" height="56" rx="10" stroke-width="0.5"/><text class="th" x="340" y="199" text-anchor="middle" dominant-baseline="central">Embeddings</text><text class="ts" x="340" y="227" text-anchor="middle" dominant-baseline="central">ComplEx prediction</text>
<rect class="box-purple" x="434" y="185" width="166" height="56" rx="10" stroke-width="0.5"/><text class="th" x="517" y="199" text-anchor="middle" dominant-baseline="central">Evolution</text><text class="ts" x="517" y="227" text-anchor="middle" dominant-baseline="central">Staleness tracking</text>

<line x1="340" y1="270" x2="340" y2="300" class="arr" marker-end="url(#arrow)"/>

<rect class="box-teal" x="200" y="300" width="280" height="56" rx="10" stroke-width="0.5"/><text class="th" x="340" y="314" text-anchor="middle" dominant-baseline="central">Query service</text><text class="ts" x="340" y="342" text-anchor="middle" dominant-baseline="central">Locate / explain / staleness</text>

<line x1="340" y1="356" x2="145" y2="390" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="356" x2="340" y2="390" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="356" x2="535" y2="390" class="arr" marker-end="url(#arrow)"/>

<rect class="box-gray" x="60" y="390" width="170" height="56" rx="10" stroke-width="0.5"/><text class="th" x="145" y="404" text-anchor="middle" dominant-baseline="central">LLM interface</text><text class="ts" x="145" y="432" text-anchor="middle" dominant-baseline="central">sasha_gpt (planned)</text>
<rect class="box-gray" x="255" y="390" width="170" height="56" rx="10" stroke-width="0.5"/><text class="th" x="340" y="404" text-anchor="middle" dominant-baseline="central">GraspKG</text><text class="ts" x="340" y="432" text-anchor="middle" dominant-baseline="central">Grasp type reasoning</text>
<rect class="box-amber" x="450" y="390" width="170" height="56" rx="10"/><text class="th" x="535" y="404" text-anchor="middle" dominant-baseline="central">Real robot (HSR)</text><text class="ts" x="535" y="432" text-anchor="middle" dominant-baseline="central">Partial integration</text>
</svg>
